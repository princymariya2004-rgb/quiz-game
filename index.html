<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="quiz-container">
        <h1>✨ Fun Quiz Game ✨</h1>
        <h2 id="question">Question will appear here</h2>
        <div class="options">
            <button class="option">Option 1</button>
            <button class="option">Option 2</button>
            <button class="option">Option 3</button>
            <button class="option">Option 4</button>
        </div>
        <button id="next-btn">Next</button>
    </div>

    <div id="score-container" style="display:none;">
        <h1>🎉 Quiz Completed!</h1>
        <h2>Your Score: <span id="score"></span></h2>
        <button id="back-btn">Back to Quiz</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
